<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIT CLOUD PAIRING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --bg-dark: #0a0a0c;
            --card-bg: #16161a;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Background Animasi */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.1;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }

        p {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #232329;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0,255,136,0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,136,0.4);
            background: #00e67a;
        }

        button:active { transform: translateY(0); }

        .result-box {
            margin-top: 2rem;
            padding: 15px;
            background: #000;
            border: 1px dashed var(--primary);
            border-radius: 10px;
            display: none;
        }

        .code-title {
            font-size: 0.7rem;
            color: var(--text-gray);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #pairingCode {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--primary);
            letter-spacing: 8px;
            font-weight: bold;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="container">
        <h1>SIGIT-DEV PAIRING</h1>
        <p>Hubungkan Bot Ourin-AI ke WhatsApp Anda</p>

        <div class="input-group">
            <label for="num">Nomor WhatsApp (dengan Kode Negara)</label>
            <input type="number" id="num" placeholder="Contoh: 62858xxxxxx" required>
        </div>

        <button id="btnPair" onclick="submitNumber()">DAPATKAN KODE</button>

        <div id="status" class="status-msg">
            <span class="loader"></span> Menghubungi Server Hugging Face...
        </div>

        <div id="resultBox" class="result-box">
            <div class="code-title">MASUKKAN KODE INI DI WHATSAPP</div>
            <div id="pairingCode">ABCDEFGH</div>
            <p style="font-size: 0.7rem; margin-top: 10px; color: #666;">Buka WA > Perangkat Tertaut > Tautkan Perangkat > Tautkan dengan nomor telepon saja.</p>
        </div>
    </div>

    <script>
        // FUNGSI UTAMA (Logika dari index.js lama Bos)
        async function submitNumber() {
            const numInput = document.getElementById('num');
            const btn = document.getElementById('btnPair');
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            const pairingCodeDisplay = document.getElementById('pairingCode');

            const phoneNumber = numInput.value.trim();

            if (!phoneNumber || phoneNumber.length < 10) {
                alert("Masukkan nomor WhatsApp yang valid (contoh: 628xxx)!");
                return;
            }

            // UI Feedback
            btn.disabled = true;
            btn.style.opacity = "0.5";
            status.style.display = "block";
            resultBox.style.display = "none";

            try {
                /* LOGIKA INTEGRASI: 
                   Karena Vercel adalah Client-Side, Bos perlu mengarahkan fetch ini 
                   ke URL Hugging Face Space Bos yang menjalankan bot.
                */
                
                // Contoh integrasi simulasi (Ganti dengan API URL Bot HF Bos nanti)
                const response = await fetch(`https://YOUR_HF_SPACE_URL/api/pairing?number=${phoneNumber}`);
                const data = await response.json();

                if (data.code) {
                    pairingCodeDisplay.innerText = data.code;
                    resultBox.style.display = "block";
                } else {
                    throw new Error("Gagal mendapatkan kode.");
                }

            } catch (err) {
                // Untuk tahap Testing di Hugging Face:
                // Karena kita belum set API di HF, kita munculkan pesan manual dulu.
                console.log(err);
                alert("Koneksi ke Bot Hugging Face gagal. Pastikan Bot sudah RUNNING di Space!");
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
                status.style.display = "none";
            }
        }
    </script>
</body>
</html>
